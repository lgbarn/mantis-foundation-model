[run]
name = "mantisv2-supertrend-topstep-100k-head-c0001-v2"
seed = 42
artifact_root = "/Volumes/Storage/trading-research/artifacts/mantis-foundation-model"
device = "mps"
allow_overwrite = false

[data]
root = "/Volumes/Storage/trading-research/data/FFM_NEXTLEG"
symbols = ["ES", "NQ", "RTY", "YM", "GC", "CL", "ZB"]
contract_multipliers = [50.0, 20.0, 50.0, 5.0, 100.0, 1000.0, 1000.0]
timeframes = ["1min", "3min", "15min"]
decision_timeframe = "3min"
timestamp_column = "datetime"
timestamp_semantics = "bar_open"
feature_columns = ["open", "high", "low", "close", "volume"]
context_bars = 200
holdout_start = "2026-01-01T00:00:00+00:00"

[foundation]
manifest_path = "/Volumes/Storage/trading-research/artifacts/mantis-foundation-model/mantisv2-nextleg-mps-target-clamp-v2/export/manifest.json"
weights_sha256 = "e375cfdb9df0bfd86281468855150a6f95754f4b2b6ed7db42219ec6d309a675"
return_transf_layer = -1
output_token = "cls_token"
preprocessing = "nextleg_standardized"
input_length = 512
batch_size = 128
shard_rows = 8192
storage_dtype = "float16"

[strategy]
atr_period = 20
supertrend_period = 10
supertrend_multiplier = 3.0
stop_atr = 0.5
target_r = 3.0
analysis_targets_r = [2.0, 3.0, 4.0, 6.0]
horizon_bars = 120
round_trip_cost_r = 0.03
cooldown_bars = 20
same_bar_policy = "stop_first"

[walk_forward]
train_months = 24
validation_months = 3
test_months = 3
stride_months = 3
embargo_bars = 1000
threshold_percentile = 50.0
max_fit_rows = 25000
max_iter = 1000
class_weight = "balanced"
solver = "lbfgs"
regularization_c = 0.0001
tolerance = 0.0001
convergence_policy = "fail"
embed_manifest_path = "/Volumes/Storage/trading-research/artifacts/mantis-foundation-model/mantisv2-supertrend-topstep-100k/embed/manifest.json"
embed_manifest_sha256 = "0b489575db78173d8cfb9f3ae30d661f656d6a701b3e8c2b4d4ca11bd5d4d4df"
embed_producer_config_path = "supertrend-topstep-100k.toml"
embed_producer_config_sha256 = "7b3308ab08aebddc6c69bc04a99ff229dd614e5ab5f0f569d1b41100670e1afb"

[topstep]
starting_balance = 100000.0
profit_target = 6000.0
mll_distance = 3000.0
mll_lock_balance = 100000.0
consistency_limit = 0.50
consistency_comparator = "strict"
max_mini_equivalents = 10.0
contracts = 1
minimum_trading_days = 2
session_timezone = "America/Chicago"
session_start_hour = 17
session_end_hour = 15
session_end_minute = 10
daily_loss_limit_enabled = false
daily_loss_limit = 2000.0

[evaluation]
allow_holdout = false
holdout_unlock = "REVIEWED-ONE-TIME-HOLDOUT"
