[run]
name = "mantisv2-nextleg-mps-target-clamp-v2"
seed = 42
artifact_root = "/Volumes/Storage/trading-research/artifacts/mantis-foundation-model"
device = "mps"
require_accelerator = true
allow_overwrite = false

[data]
root = "/Volumes/Storage/trading-research/data/FFM_NEXTLEG"
symbols = ["ES", "NQ", "RTY", "YM", "GC", "SI", "CL", "ZB", "ZN"]
intervals = ["1min", "3min", "5min", "15min"]
timestamp_column = "datetime"
feature_columns = ["open", "high", "low", "close", "volume"]
holdout_start = "2026-01-01T00:00:00+00:00"
validation_fraction = 0.10
context_lengths = [64, 100, 150, 200]
target_reserve = 712

[model]
source_repository = "vfeofanov/mantis"
source_revision = "0c94f8ceb9f1d1421dd292ed917090df8c31605b"
hub_model = "paris-noah/MantisV2"
hub_revision = "99fe0f548960e272fbfa4b82fd9b5b5956779dfd"
weights_sha256 = "49d46d9a49cccdc87c46f4e0088fa52c0a6ef7eb4c13de5cc9815426b7b17ab1"
input_length = 512
channel_strategy = "independent_concat"
mode = "full_finetune"

[training]
epochs = 120
batch_size = 128
learning_rate = 0.0001188117389055629
weight_decay = 0.05
num_workers = 0
checkpoint_every = 1
resume = true
max_steps_per_epoch = 200
validation_max_steps = 20
warmup_epochs = 10
early_stopping_patience = 8

[target]
kind = "nextleg"
horizons = [5, 10, 20, 25]
leg_cap = 256
leg_k = 2
normalization_clamp = 10.0
candle_loss_weight = 1.0
leg_loss_weight = 1.0
minimum_train_anchors = 1000
minimum_validation_anchors = 200

[evaluation]
allow_holdout = false

[export]
format = "safetensors"
verify_atol = 0.00001
verify_rtol = 0.0001
