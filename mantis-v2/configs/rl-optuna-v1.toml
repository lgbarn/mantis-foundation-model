[rl.tuning]
schema_version = 1
study_name = "mantis-v2-topstep-100k-shared-ticker-value-v1"
direction = "maximize"
maximum_trials = 30
timesteps_per_seed = 500000
seeds_per_trial = 3
n_jobs = 1

[rl.tuning.sampler]
name = "TPESampler"
optuna_version = "4.9.0"
n_startup_trials = 10
n_ei_candidates = 24
multivariate = false
group = false
constant_liar = false
proposal_seed_namespace = "mantis-v2-topstep-100k-optuna-proposal-v1"
proposal_seed_method = "sha256-u31-v1"

[rl.tuning.pruner]
name = "MedianPruner"
n_startup_trials = 10
n_warmup_steps = 0
interval_steps = 1
n_min_trials = 5
minimum_completed_validation_seeds_before_check = 2

[rl.tuning.training_seeds]
namespace = "mantis-v2-topstep-100k-optuna-v1"
method = "sha256-u31-v1"
indices = [0, 1, 2]

[rl.tuning.search_space.learning_rate]
distribution = "float"
low = 0.0001
high = 0.001
log = true

[rl.tuning.search_space.rollout_length]
distribution = "categorical"
choices = [14, 28, 56]
unit = "complete_episodes"

[rl.tuning.search_space.batch_size]
distribution = "categorical"
choices = [256, 512, 1024]

[rl.tuning.search_space.gae_lambda]
distribution = "float"
low = 0.90
high = 0.99
log = false

[rl.tuning.search_space.clip_range]
distribution = "categorical"
choices = [0.1, 0.2, 0.3]

[rl.tuning.search_space.entropy_coefficient]
distribution = "float"
low = 0.0001
high = 0.03
log = true

[rl.tuning.search_space.value_loss_coefficient]
distribution = "categorical"
choices = [0.25, 0.5, 1.0]

[rl.tuning.search_space.max_grad_norm]
distribution = "categorical"
choices = [0.3, 0.5, 1.0]

[rl.tuning.search_space.hidden_width]
distribution = "categorical"
choices = [64, 128, 256]
