[project]
name = "mantis-v2-training"
version = "0.1.0"
description = "Reproducible MantisV2 training pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub>=0.23,<2",
  "mantis-tsfm==1.0.0",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=25,<26",
  "safetensors>=0.4,<0.5",
  "scikit-learn>=1.9,<2",
  "torch>=2.4,<3",
]

[project.scripts]
mantis-v2 = "mantis_v2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mantis_v2"]
