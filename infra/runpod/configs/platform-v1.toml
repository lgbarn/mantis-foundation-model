schema_version = 1

[provider]
secure_cloud = true
allowed_gpu_types = ["NVIDIA H100 80GB HBM3", "NVIDIA L40S", "NVIDIA A40"]
allowed_datacenters = ["US-MO-1"]
minimum_vcpu = 8
minimum_ram_gb = 32
container_disk_gb = 50

[adapter]
base_url = "https://rest.runpod.io/v1"
openapi_identity = "https://rest.runpod.io/v1/openapi.json"
openapi_version = "v1"
openapi_sha256 = "f4be55173a5392150d805d103b1ee3aeff23defec40052dd3188d606ddedddfc"

[storage]
volume_gb = 150
high_water_bytes = 120000000000
minimum_free_bytes = 30000000000

[lifecycle]
maximum_inventory_age_seconds = 300
maximum_duration_seconds = 7200
startup_allowance_seconds = 1800

[billing]
container_disk_usd_per_gb_month = "0.10"
billing_month_hours = 730

[budget]
account_ceiling_usd = "150.00"
storage_usd = "15.00"
qualification_usd = "25.00"
production_usd = "85.00"
protected_recovery_usd = "25.00"
ordinary_launch_cutoff_usd = "125.00"
