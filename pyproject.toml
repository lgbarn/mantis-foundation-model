[project]
name = "mantis-foundation-model"
version = "0.1.0"
description = "Training workspace for the Mantis foundation-model family"
requires-python = ">=3.12,<3.13"
dependencies = ["mantis-v2-training"]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
]

[tool.uv.workspace]
members = ["mantis-v2"]

[tool.uv.sources]
mantis-v2-training = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["mantis-v2/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mantis_v2"]
mypy_path = "mantis-v2/src"

[[tool.mypy.overrides]]
module = ["mantis.*", "pandas.*", "safetensors.*"]
ignore_missing_imports = true
